name: 毎朝のロボカップジュニア情報配信

on:
  schedule:
    # 毎朝 7:00 JST（= 22:00 UTC の前日）
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "送信せず内容だけ確認する"
        type: boolean
        default: false
      force:
        description: "既読を無視して取得できた全件を対象にする"
        type: boolean
        default: false
      only:
        description: "特定の情報源だけ処理する (sources.json の id、カンマ区切り)"
        type: string
        default: ""

# 既読状態をコミットするので、同時実行を避ける
concurrency:
  group: rcj-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    # 収集自体は sources.json の total_time_budget (既定 600 秒) で打ち切るので、
    # ここはその上限に余裕を足した値
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: テストを実行
        run: python -m unittest discover -s tests -v

      - name: 情報を収集して Discord へ送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          python -m rcj_news.main $ARGS

      - name: 既読状態をコミット
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "既読状態に変化はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: 既読状態を更新 [skip ci]"

          # 同時刻に別の更新が入っていた場合に備えて数回リトライする
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失敗。rebase して再試行します ($attempt 回目)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "既読状態を push できませんでした" >&2
          exit 1
